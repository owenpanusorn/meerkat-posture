[project]
name = "meerkat-posture"
version = "0.1.0"
description = "Offline posture reminder using your webcam. No images stored, no network calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "owenpanusorn", email = "panusorn.owen@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "desktop-notifier>=6.2.0",
    "mediapipe>=1.2.2",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "tomli-w>=1.2.0",
]

[project.scripts]
meerkat = "meerkat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meerkat"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
