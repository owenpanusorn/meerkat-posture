name: Release

# Push a tag like v0.1.0 -> test, build Meerkat.exe, publish a GitHub Release with
# Meerkat-windows-x64.zip (+ .sha256). install.ps1 downloads that zip.
# "Run workflow" by hand builds the zip as a workflow artifact only (no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write # create the release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = uv run --locked python -c "import meerkat; print(meerkat.__version__)"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match meerkat.__version__ $version"
          }

      - name: Install
        run: uv sync --locked

      - name: Lint + test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      # Build time only: the app itself never downloads anything.
      - name: Download models
        run: uv run python scripts/download_models.py

      - name: Build
        run: uv run pyinstaller meerkat.spec --noconfirm

      - name: Self-test the .exe
        env:
          MEERKAT_HOME: ${{ runner.temp }}/meerkat-home
        run: |
          $p = Start-Process dist/Meerkat/Meerkat.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:MEERKAT_HOME/meerkat.log"
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Zip
        run: |
          New-Item -ItemType Directory out | Out-Null
          7z a -tzip -mx=7 out/Meerkat-windows-x64.zip ./dist/Meerkat | Out-Null
          $hash = (Get-FileHash out/Meerkat-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Meerkat-windows-x64.zip" | Set-Content -NoNewline out/Meerkat-windows-x64.zip.sha256
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Meerkat-windows-x64
          path: out/*
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME out/* `
            --title "Meerkat $env:GITHUB_REF_NAME" --generate-notes
